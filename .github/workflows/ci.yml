name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Select Xcode 26.5
        run: sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer

      - name: Set up Node.js for DMG packaging
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Scripts/dmg/package-lock.json

      - name: Install DMG tools
        run: npm ci --prefix Scripts/dmg

      - name: Build with warnings as errors
        run: |
          xcodebuild build-for-testing \
            -project Arson.xcodeproj \
            -scheme Arson \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/ArsonDerivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests
        run: |
          xcodebuild test-without-building \
            -project Arson.xcodeproj \
            -scheme Arson \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/ArsonDerivedData" \
            -only-testing:ArsonTests \
            CODE_SIGNING_ALLOWED=NO

      - name: Run UI and accessibility tests
        run: |
          xcodebuild test \
            -project Arson.xcodeproj \
            -scheme Arson \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/ArsonUIDerivedData" \
            -only-testing:ArsonUITests \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=-

      - name: Build release configuration
        run: |
          xcodebuild build \
            -project Arson.xcodeproj \
            -scheme Arson \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/ArsonReleaseDerivedData" \
            CODE_SIGNING_ALLOWED=NO
          release_binary="$RUNNER_TEMP/ArsonReleaseDerivedData/Build/Products/Release/Arson.app/Contents/MacOS/Arson"
          lipo "$release_binary" -verify_arch arm64
          lipo "$release_binary" -verify_arch x86_64

      - name: Build and verify installer DMG
        run: |
          cmp LICENSE "$RUNNER_TEMP/ArsonReleaseDerivedData/Build/Products/Release/Arson.app/Contents/Resources/LICENSE"
          ./Scripts/create-dmg.sh \
            "$RUNNER_TEMP/ArsonReleaseDerivedData/Build/Products/Release/Arson.app" \
            "$RUNNER_TEMP/Arson.dmg"
          hdiutil imageinfo -plist "$RUNNER_TEMP/Arson.dmg" > "$RUNNER_TEMP/Arson-image-info.plist"
          python3 -c 'import plistlib, sys; assert plistlib.load(open(sys.argv[1], "rb"))["Properties"]["Software License Agreement"] is False' "$RUNNER_TEMP/Arson-image-info.plist"
