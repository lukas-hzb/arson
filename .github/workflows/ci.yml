name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Select Xcode 26.5
        run: sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer

      - name: Build with warnings as errors
        run: |
          xcodebuild build-for-testing \
            -project Arson.xcodeproj \
            -scheme Arson \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/ArsonDerivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests
        run: |
          xcodebuild test-without-building \
            -project Arson.xcodeproj \
            -scheme Arson \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/ArsonDerivedData" \
            -only-testing:ArsonTests \
            CODE_SIGNING_ALLOWED=NO

      - name: Run UI and accessibility tests
        run: |
          xcodebuild test \
            -project Arson.xcodeproj \
            -scheme Arson \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/ArsonUIDerivedData" \
            -only-testing:ArsonUITests \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=-

      - name: Build release configuration
        run: |
          xcodebuild build \
            -project Arson.xcodeproj \
            -scheme Arson \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/ArsonReleaseDerivedData" \
            CODE_SIGNING_ALLOWED=NO
          lipo -verify_arch arm64 x86_64 \
            "$RUNNER_TEMP/ArsonReleaseDerivedData/Build/Products/Release/Arson.app/Contents/MacOS/Arson"
