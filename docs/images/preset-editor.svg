  <rect width="1200" height="750" rx="36" fill="url(#background)" />
  <rect x="170" y="90" width="860" height="570" rx="24" fill="#26282f" stroke="#50535d" stroke-width="3" />
  <rect x="240" y="175" width="720" height="62" rx="12" fill="#343740" />
  <rect x="240" y="277" width="335" height="62" rx="12" fill="#343740" />
